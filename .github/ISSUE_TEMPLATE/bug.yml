name: Bug
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issues do not go here — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or the API response
      description: |
        Tide logs JSON; the `request_id` ties a log line to a response.
        **Remove tokens and passwords first.**
      render: text
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations: { required: true }
  - type: input
    id: upstreams
    attributes:
      label: Kargo and Argo CD versions
      description: Shown on the upstreams page under Admin.
