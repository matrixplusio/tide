version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ["*"] }
  # One pull request per ecosystem and run: ungrouped, every action got its
  # own, and five sat open at once.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  # Base images move only on purpose: a new Go has to change go.mod, CI and
  # golangci-lint with it, and Node majors past the LTS line drop things the
  # build uses (Node 25 has no corepack). Patches within a line still come.
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    groups:
      docker: { patterns: ["*"] }
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
