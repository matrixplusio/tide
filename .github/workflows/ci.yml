# The same gates as `make check`, minus the parts that need a cluster.
#
# The integration tests are not optional here: the audit trail is append-only
# because of a PostgreSQL grant, and leader election is a PostgreSQL advisory
# lock. Neither can be tested without a real server, and both are the kind of
# thing that breaks quietly.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  # The release workflow runs these same gates before publishing anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Create the two roles and the database
        # Exactly what `tide sql` prints. The runtime role must not own the
        # tables: that is what makes the audit trail tamper-proof, and the
        # tests below check it.
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -d postgres <<'SQL'
          CREATE ROLE tide_owner LOGIN PASSWORD 'ci-owner';
          CREATE ROLE tide_app   LOGIN PASSWORD 'ci-app';
          CREATE DATABASE tide_test OWNER tide_owner;
          SQL
          psql -h localhost -U postgres -d tide_test -c \
            "REVOKE ALL ON SCHEMA public FROM PUBLIC;
             GRANT ALL ON SCHEMA public TO tide_owner;
             GRANT USAGE ON SCHEMA public TO tide_app;"

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      - name: Tests, with a real PostgreSQL and a real Redis
        env:
          TIDE_TEST_OWNER_URL: postgres://tide_owner:ci-owner@localhost:5432/tide_test?sslmode=disable
          TIDE_TEST_APP_URL: postgres://tide_app:ci-app@localhost:5432/tide_test?sslmode=disable
          TIDE_TEST_REDIS_URL: redis://localhost:6379/9
        # -p 1: the database tests reset the schema, so they cannot share it.
        run: go test -race -count=1 -p 1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      # The repository root has no package.json; the pinned pnpm version lives
      # in web/package.json ("packageManager").
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  image:
    # Proves the Dockerfile still builds — frontend, Go, distroless. A push to
    # main also publishes it, so "the current main" is something you can pull;
    # a pull request only builds, because a fork's PR must not be able to
    # publish under this repository's name.
    runs-on: ubuntu-latest
    # Declared here rather than at the top: a reusable workflow may not ask
    # for more than its caller granted, and the release workflow calls this
    # one only to run the gates.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - id: meta
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        if: steps.meta.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.meta.outputs.push == 'true' }}
          # Never :latest from a branch — that tag belongs to releases.
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: |
            VERSION=main
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
