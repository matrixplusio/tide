# Hot reload for the dev cluster backend (deploy/dev/tide.yaml).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o tmp/tide ./cmd/tide"
  bin = "tmp/tide"
  # migrate as the schema owner, then serve as tide_app.
  full_bin = "sh -c 'tmp/tide migrate && exec tmp/tide serve'"
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "web", "deploy", "docs", "internal/web/dist", ".git"]
  exclude_regex = ["_test.go"]
  poll = true
  poll_interval = 500
  delay = 500
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[misc]
  clean_on_exit = true
